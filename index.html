<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 4C3 3.44772 3.44772 3 4 3H20C20.5523 3 21 3.44772 21 4V6.58579C21 6.851 20.8946 7.10536 20.7071 7.29289L14 14V20C14 20.5523 13.5523 21 13 21H11C10.4477 21 10 20.5523 10 20V14L3.29289 7.29289C3.10536 7.10536 3 6.851 3 6.58579V4Z" fill="currentColor"/>
                </svg>
                <h2>LeadPredictor</h2>
            </div>
            
            <div class="input-group">
                <label data-i18n="language"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg> Language</label>
                <select id="language">
                    <option value="en">🇺🇸 English</option>
                    <option value="bg">🇧🇬 Български</option>
                </select>
            </div>

            <div class="input-group">
                <label data-i18n="currency"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Currency</label>
                <select id="currency">
                    <option value="usd">$ US Dollar</option>
                </select>
            </div>

            <div class="input-group">
                <label data-i18n="campaignStart"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> Campaign Start</label>
                <input type="date" id="startDate" value="2026-05-08">
            </div>

            <div class="input-group">
                <label data-i18n="campaignEnd"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> Campaign End</label>
                <input type="date" id="endDate" value="2026-11-04">
            </div>

            <div class="input-group">
                <label data-i18n="totalRevenue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg> Total Revenue</label>
                <div class="input-with-prefix">
                    <span class="prefix">$</span>
                    <input type="number" id="revenue" value="10000">
                </div>
            </div>

            <div class="input-group">
                <label data-i18n="aov"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg> Avg. Order Value</label>
                <div class="input-with-prefix">
                    <span class="prefix">$</span>
                    <input type="number" id="aov" value="1000">
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-section">
                <!-- Chart Area -->
                <div class="chart-card" id="chartCard">
                    <div class="chart-container" id="chartContainer">
                        <!-- Chart generated via JS -->
                    </div>
                </div>

                <!-- KPIs -->
                <div class="kpi-container">
                    <div class="kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> <span data-i18n="prospects">Prospects</span></span>
                            <span class="kpi-percent" id="prospectsPercent">100%</span>
                        </div>
                        <div class="kpi-value" id="prospectsValue">125</div>
                        <div class="progress-bar"><div class="progress-fill" id="prospectsProgress" style="width: 100%;"></div></div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> <span data-i18n="leads">Leads</span></span>
                            <span class="kpi-percent" id="leadsPercent">20%</span>
                        </div>
                        <div class="kpi-value" id="leadsValue">25</div>
                        <div class="progress-bar"><div class="progress-fill" id="leadsProgress" style="width: 20%;"></div></div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg> <span data-i18n="customers">Customers</span></span>
                            <span class="kpi-percent" id="customersPercent">8%</span>
                        </div>
                        <div class="kpi-value" id="customersValue">10</div>
                        <div class="progress-bar"><div class="progress-fill" id="customersProgress" style="width: 8%;"></div></div>
                    </div>
                </div>
            </div>

            <!-- Sliders Area -->
            <div class="sliders-card">
                <div class="slider-group">
                    <div class="slider-header">
                        <label data-i18n="leadRate">Lead Response Rate</label>
                    </div>
                    <input type="range" id="leadRate" min="1" max="100" value="40" step="1">
                    <div class="slider-value-right" id="leadRateDisplay">40.00%</div>
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <label data-i18n="prospectRate">Prospect Response Rate</label>
                    </div>
                    <input type="range" id="prospectRate" min="1" max="100" value="20" step="1">
                    <div class="slider-value-right" id="prospectRateDisplay">20.00%</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
